# Game server for the VPS. Nothing is published on the host: cloudflared opens
# an outbound tunnel and Cloudflare routes kaplumbaga-api.eren.sh to server:8000.
#
#   cp .env-sample .env   # paste the tunnel token
#   kaplumbaga-deploy <commit>   # see deploy/vps-deploy.sh

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    # CI pushes an image for every commit on main, kaplumbaga-deploy sets
    # SERVER_TAG to the commit it deploys. Without it compose builds here.
    image: ghcr.io/erentnr/kaplumbaga-server:${SERVER_TAG:-local}
    build: ./server
    restart: unless-stopped
    environment:
      CORS_ORIGINS: https://kaplumbaga.eren.sh
      # client IP for the rate limits, set by Cloudflare
      TRUSTED_IP_HEADER: CF-Connecting-IP
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      server:
        condition: service_healthy
    logging: *logging
